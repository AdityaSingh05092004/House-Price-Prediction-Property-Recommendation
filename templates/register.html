{% extends "base.html" %}
{% block title %}Register | ApnaGhar{% endblock %}
{% block content %}
<section class="page-intro"><div class="eyebrow">JOIN APNAGHAR</div><h1>Create your<br><span>account.</span></h1><p>Register to add properties and prices.</p></section>
<section class="panel auth-panel">
<form method="post" class="form-grid">
<label>Username<input name="username" required minlength="3" maxlength="50" autocomplete="username"></label>
<label>Password<input name="password" type="password" required minlength="6" autocomplete="new-password"></label>
<label>Confirm password<input name="confirm" type="password" required minlength="6" autocomplete="new-password"></label>
<div class="form-actions"><button class="button" type="submit">Register ↗</button></div>
</form>
<p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</section>
{% endblock %}
